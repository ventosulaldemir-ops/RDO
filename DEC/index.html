<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Híbrido - DEC</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../code16.css?v=34">
<style>
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(15,23,42,.06);padding:14px;text-decoration:none;color:inherit;display:flex;gap:12px;align-items:flex-start}
  .card:hover{box-shadow:0 10px 30px rgba(15,23,42,.1)}
  .icon{font-size:22px;line-height:1}
  .txt h3{font-size:14px;margin:0 0 4px}
  .txt p{font-size:12px;color:var(--ink2);margin:0 0 6px}
  .muted{font-size:11px;color:var(--ink3)}
  
  @media (max-width: 640px) {
    .topbar-in {
      height: auto;
      min-height: 52px;
      padding: 8px 10px;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand {
      min-width: 0;
      flex: 1 1 auto;
    }
    .brand h1 {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand small {
      font-size: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      flex: 0 0 auto;
      width: auto;
      justify-content: flex-end;
      flex-wrap: nowrap;
      gap: 6px;
    }
    .actions .btn {
      flex: 0 0 auto;
      white-space: nowrap;
      font-size: 9px;
      padding: 6px 9px;
      min-height: 32px;
    }
    .container {
      padding: 0 10px !important;
      margin: 14px auto !important;
    }
    .cards {
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .card {
      padding: 12px;
      gap: 10px;
    }
    .icon {
      font-size: 20px;
    }
    .txt h3 {
      font-size: 13px;
    }
    .txt p {
      font-size: 11px;
    }
    .muted {
      font-size: 10px;
    }
    .sec-h h2 {
      font-size: 18px;
    }
    .sec-h p {
      font-size: 12px;
    }
  }
  
  @media (max-width: 360px) {
    .brand h1 { font-size: 13px; }
    .actions .btn { font-size: 8px; padding: 6px 7px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo">DEC</div>
      <div>
        <h1>Painéis</h1>
        <small>Acompanhamento e relatórios</small>
      </div>
    </div>
    <div class="actions">
      <a class="btn btn-a" href="../index.html">Voltar ao RDO</a>

      <a class="btn btn-a" href="test.html" target="_blank" rel="noopener">Acompanhamento Físico</a>
    </div>
  </div>
</div>
<div class="container" style="max-width:1100px;margin:18px auto;padding:0 12px">
  <div class="sec-h">
    <div>
      <h2>Painéis Disponíveis</h2>
      <p>Todos acessíveis a partir daqui.</p>
    </div>
  </div>
  <div class="cards">
    <a class="card" href="../index.html">
      <div class="icon">📊</div>
      <div class="txt">
        <h3>RDO</h3>
        <p>Relatório Diário de Obra</p>
        <div class="muted">Principal - Equipe, Produção, PPC</div>
      </div>
    </a>
    <a class="card" href="test.html" target="_blank" rel="noopener">
      <div class="icon">📈</div>
      <div class="txt">
        <h3>Acompanhamento Físico</h3>
        <p>Painel de avanço físico</p>
        <div class="muted">Acompanhamento da obra</div>
      </div>
    </a>

  </div>
</div>
</body>
</html>
