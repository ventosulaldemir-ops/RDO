<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RDO - Relatorio Diario de Obra</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1D33;--navy2:#122B4D;--paper:#F4F6F8;--w:#fff;--ink:#1A2332;--ink2:#475569;--ink3:#94A3B8;--green:#0D9F4F;--greenBg:#E6F9EE;--amber:#D97706;--amberBg:#FEF3C7;--red:#DC2626;--redBg:#FEE2E2;--blue:#2563EB;--blueBg:#DBEAFE;--cyan:#0891B2;--line:#CBD5E1;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(var(--safe-b) + 20px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
input,select,button{-webkit-appearance:none;appearance:none}
.topbar{background:var(--navy);color:#fff;padding:0 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 16px rgba(0,0,0,.2)}
.topbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:52px;gap:8px}
.logo{width:32px;height:32px;min-width:32px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:11px;color:var(--navy);border-radius:3px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:'Space Grotesk';font-size:16px;font-weight:700}
.brand small{font-size:9px;color:#8BADC4;display:block;line-height:1.2}
.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.livedot{width:7px;height:7px;border-radius:50%;background:#6EE7A0;display:inline-block;animation:pulse 1.6s ease infinite;margin-right:2px}
.chip{font-family:'JetBrains Mono';font-size:9px;padding:3px 9px;border-radius:20px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip-ok{background:rgba(13,159,79,.18);color:#6EE7A0;border:1px solid rgba(13,159,79,.25)}
.chip-warn{background:rgba(217,119,6,.18);color:#FCD34D;border:1px solid rgba(217,119,6,.25)}
.chip-err{background:rgba(220,38,38,.18);color:#FCA5A5;border:1px solid rgba(220,38,38,.25)}
.btn{font-family:'JetBrains Mono';font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:3px;transition:all .15s;min-height:34px;touch-action:manipulation}
.btn-a{background:var(--amber);color:var(--navy)}.btn-a:hover{background:#F59E0B}
.btn-bl{background:var(--blue);color:#fff}.btn-bl:hover{background:#1D4ED8}
.btn-gr{background:var(--green);color:#fff}
.btn.spin svg{animation:spin .8s linear infinite}
.container{max-width:1280px;margin:0 auto;padding:16px 14px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:8px;flex-wrap:wrap}
.sec-h h2{font-family:'Space Grotesk';font-size:20px;font-weight:700;color:var(--navy)}
.sec-h p{color:var(--ink2);font-size:11px;margin-top:2px}
.tag-rdo{font-family:'JetBrains Mono';font-size:8px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;background:#059669;color:#fff;padding:2px 7px;border-radius:2px;margin-right:6px}
.date-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--w);border:1px solid var(--line);border-radius:4px;margin-bottom:14px;flex-wrap:wrap}
.date-bar label{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.date-bar select{font-family:'Inter';font-size:13px;padding:8px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:3px;min-height:38px;flex:1;min-width:180px;max-width:280px}
.date-bar select:focus{outline:2px solid var(--amber);outline-offset:-1px}
.date-bar .date-nav{display:flex;align-items:center;gap:4px}
.date-bar .date-nav button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--w);color:var(--navy);border-radius:3px;cursor:pointer;transition:all .15s;font-size:14px;line-height:1;padding:0}
.date-bar .date-nav button:hover{background:var(--paper);border-color:var(--navy)}
.date-bar .date-nav button:disabled{opacity:.3;cursor:not-allowed}
.date-bar .date-badge{font-family:'JetBrains Mono';font-size:9px;padding:3px 8px;border-radius:3px;background:var(--blueBg);color:#1D4ED8;font-weight:600;white-space:nowrap}
.kr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kp{background:var(--w);border:1px solid var(--line);padding:14px;position:relative;overflow:hidden;border-radius:4px;transition:box-shadow .2s}
.kp:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.kp::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:var(--kc,var(--navy))}
.kp .ki{font-size:18px;margin-bottom:6px}
.kp .kl{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.kp .kv{font-family:'Space Grotesk';font-size:26px;font-weight:700;color:var(--navy);line-height:1}
.kp .kf{font-size:10px;color:var(--ink2);margin-top:5px}
.cd{background:var(--w);border:1px solid var(--line);border-radius:4px;margin-bottom:14px;overflow:hidden}
.cd-h{padding:11px 16px;border-bottom:1px solid var(--line);background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cd-h h3{font-family:'Space Grotesk';font-size:13px;font-weight:600;color:var(--navy)}
.cd-h .mt{font-family:'JetBrains Mono';font-size:9px;color:var(--ink3)}
.cd-b{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cd-t{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--w);flex-wrap:wrap;align-items:center}
.cd-t input,.cd-t select{font-family:'Inter';font-size:13px;padding:8px 10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:3px;min-height:38px;flex:1;min-width:130px}
.cd-t input:focus,.cd-t select:focus{outline:2px solid var(--amber);outline-offset:-1px}
.cd-t .ct{font-family:'JetBrains Mono';font-size:9px;color:var(--ink3);white-space:nowrap;width:100%;text-align:right;margin-top:2px}
table.t{width:100%;border-collapse:collapse;font-size:12px;min-width:620px}
table.t th{position:sticky;top:0;background:var(--navy);color:#fff;font-family:'JetBrains Mono';font-weight:500;font-size:9px;letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:9px 12px;white-space:nowrap;z-index:2;cursor:pointer;user-select:none}
table.t th:hover{background:var(--navy2)}
table.t th.asc::after{content:' \25B2'}
table.t th.desc::after{content:' \25BC'}
table.t td{padding:8px 12px;border-bottom:1px solid #EEF2F6;vertical-align:middle;font-size:12px}
table.t tr:last-child td{border-bottom:none}
table.t tr:hover td{background:#F8FAFC}
table.t tr.ferias-row td{background:#FFFBEB}
table.t tr.ferias-header td{background:#FEF3C7;font-family:'JetBrains Mono';font-size:10px;color:#92400E;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
td.nr{text-align:right;font-family:'JetBrains Mono'}
.badge{font-family:'JetBrains Mono';font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap;display:inline-block}
.badge-blue{background:var(--blueBg);color:#1D4ED8}
.badge-green{background:var(--greenBg);color:#065F46}
.badge-amber{background:var(--amberBg);color:#92400E}
.badge-red{background:var(--redBg);color:#991B1B}
.badge-gray{background:#F1F5F9;color:var(--ink2);border:1px solid var(--line)}
.badge-ferias{background:#FEF3C7;color:#92400E}
.badge-ativo{background:var(--greenBg);color:#065F46}
.badge-semativ{background:#F1F5F9;color:var(--ink3);border:1px solid var(--line)}
.badge-pav-terreo{background:#DBEAFE;color:#1E40AF;border:1px solid #93C5FD}
.badge-pav-1{background:#D1FAE5;color:#065F46;border:1px solid #6EE7B7}
.badge-pav-2{background:#FEF3C7;color:#92400E;border:1px solid #FCD34D}
.badge-pav-3{background:#EDE9FE;color:#5B21B6;border:1px solid #C4B5FD}
.badge-pav-enae{background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5}
.badge-pav-inf{background:#F0FDFA;color:#115E59;border:1px solid #5EEAD4}
.badge-pav-none{background:#F1F5F9;color:var(--ink3);border:1px solid var(--line);font-style:italic}
.gg{display:grid;grid-template-columns:1.618fr 1fr;gap:14px}
.em{padding:32px 16px;text-align:center;color:var(--ink3);font-size:12px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-label{font-family:'JetBrains Mono';font-size:10px;color:var(--ink2);min-width:140px;max-width:140px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:18px;background:var(--paper);border-radius:3px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.bar-val{font-family:'JetBrains Mono';font-size:11px;font-weight:700;min-width:28px;color:var(--navy)}
.bar-pct{font-family:'JetBrains Mono';font-size:9px;color:var(--ink3);min-width:36px}
.chart-wrap{padding:14px;overflow-x:auto}
.chart-wrap svg{display:block;width:100%;height:auto}
.err-box{margin:16px;padding:14px 16px;background:var(--redBg);border:1px solid #FCA5A5;border-radius:4px;font-family:'JetBrains Mono';font-size:11px;color:var(--red);line-height:1.7}
.err-box b{display:block;margin-bottom:4px}
.err-box a{color:var(--red);text-decoration:underline}
#toast{position:fixed;bottom:calc(var(--safe-b) + 14px);left:14px;right:14px;z-index:200;display:none;padding:12px 18px;border-radius:6px;font-family:'JetBrains Mono';font-size:11px;font-weight:700;color:#fff;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:480px;margin:0 auto}
.print-header{display:none}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important;padding:0!important}
  .topbar,.cd-t,#toast,#btn-reload,#btn-print,#btn-export,.date-bar{display:none!important}
  .print-header{display:block!important;padding:10px 0 8px;border-bottom:3px solid var(--navy);margin-bottom:12px}
  .print-header h1{font-family:'Space Grotesk';font-size:18px;font-weight:700;color:var(--navy)}
  .print-header p{font-family:'JetBrains Mono';font-size:10px;color:var(--ink2);margin-top:3px}
  .container{padding:0!important}
  .cd{page-break-inside:avoid;border:1px solid #ccc!important}
  table.t th{background:#2a3f5f!important;position:static!important;font-size:8px!important;padding:6px 8px!important}
  table.t td{padding:5px 8px!important;font-size:10px!important}
  .gg{grid-template-columns:1fr 1fr!important;gap:8px!important}
  @page{size:A4 portrait;margin:10mm 8mm 12mm 8mm}
}
@media(max-width:900px){.gg{grid-template-columns:1fr}.bar-label{min-width:100px;max-width:100px}}
@media(max-width:480px){.topbar-in{height:auto;min-height:48px;flex-wrap:wrap;padding:6px 0;gap:4px}.brand h1{font-size:13px}.actions{gap:4px;width:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}.container{padding:10px 8px}.kr{grid-template-columns:1fr 1fr;gap:6px}.kp{padding:10px}.kp .kv{font-size:20px}.cd-t{flex-direction:column}.cd-t input,.cd-t select{width:100%;font-size:14px;padding:10px;min-height:42px}.date-bar{flex-direction:column;align-items:stretch}.date-bar select{max-width:100%;width:100%}.date-bar .date-nav{justify-content:center}}
</style>
</head>
<body>
<div class="print-header" id="print-header"></div>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo">RDO</div>
      <div><h1>Relatorio Diario de Obra</h1><small id="sub-info">Carregando...</small></div>
    </div>
    <div class="actions">
      <span class="chip chip-warn" id="chip"><span class="livedot" style="display:none" id="livedot"></span><span id="chip-txt">carregando</span></span>
      <span style="font-family:'JetBrains Mono';font-size:9px;color:#8BADC4" id="clk">--:--</span>
      <button class="btn btn-a" id="btn-reload" onclick="doLoad()"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 11-2.6-6.4M21 3v6h-6"/></svg>Atualizar</button>
      <button class="btn btn-bl" id="btn-print" onclick="doPrint()"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Imprimir</button>
      <button class="btn btn-gr" id="btn-export" onclick="doExportCSV()"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>CSV</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="err-box"></div>

  <div class="sec-h">
    <div><h2><span class="tag-rdo">rdo</span>Efetivo &amp; Atividades</h2><p id="sub-date">--</p></div>
    <div style="font-family:'JetBrains Mono';font-size:9px;color:var(--ink3)" id="upd-ts">--</div>
  </div>

  <div class="date-bar" id="date-bar">
    <label for="fdate">Data:</label>
    <div class="date-nav">
      <button id="btn-prev" onclick="navDate(1)" title="Dia anterior">&#8249;</button>
      <button id="btn-next" onclick="navDate(-1)" title="Proximo dia">&#8250;</button>
    </div>
    <select id="fdate" onchange="onDateChange()"></select>
    <span class="date-badge" id="date-count-badge"></span>
  </div>

  <div class="kr" id="kpis"></div>

  <div class="gg">
    <div>
      <div class="cd">
        <div class="cd-h"><h3>Efetivo por dia</h3><span class="mt" id="chart-meta"></span></div>
        <div class="chart-wrap" id="chart-box"><div class="em">Carregando...</div></div>
      </div>
      <div class="cd">
        <div class="cd-h"><h3>Equipe do dia</h3><span class="mt" id="tbl-meta"></span></div>
        <div class="cd-t">
          <input type="text" id="fq" placeholder="Buscar nome, atividade, local..." oninput="renderTable()">
          <select id="femp" onchange="renderTable()"><option value="">Todas empresas</option></select>
          <select id="ffunc" onchange="renderTable()"><option value="">Todas funcoes</option></select>
          <select id="fpav" onchange="renderTable()"><option value="">Todos pavimentos</option></select>
          <select id="fstatus" onchange="renderTable()">
            <option value="">Todos</option>
            <option value="ativo">Com atividade</option>
            <option value="sem">Sem atividade</option>
            <option value="ferias">De ferias</option>
          </select>
          <span class="ct" id="tbl-ct"></span>
        </div>
        <div class="cd-b" id="tbl-box"></div>
      </div>
    </div>
    <div>
      <div class="cd">
        <div class="cd-h"><h3>Por empresa</h3><span class="mt" id="emp-meta"></span></div>
        <div style="padding:12px 14px" id="emp-bars"></div>
      </div>
      <div class="cd">
        <div class="cd-h"><h3>Por funcao</h3><span class="mt" id="func-meta"></span></div>
        <div style="padding:12px 14px" id="func-bars"></div>
      </div>
      <div class="cd">
        <div class="cd-h"><h3>Por pavimento</h3><span class="mt" id="pav-meta"></span></div>
        <div style="padding:12px 14px" id="pav-bars"></div>
      </div>
      <div class="cd">
        <div class="cd-h"><h3>Por local</h3><span class="mt" id="reg-meta"></span></div>
        <div style="padding:12px 14px" id="reg-bars"></div>
      </div>
    </div>
  </div>

  <div class="cd">
    <div class="cd-h"><h3>Historico por data</h3><span class="mt" id="hist-meta"></span></div>
    <div class="cd-b" id="hist-box"></div>
  </div>
</div>
<footer style="max-width:1280px;margin:0 auto;padding:12px 14px;font-size:9px;color:var(--ink3);font-family:'JetBrains Mono';border-top:1px solid var(--line)">RDO - Painel de Mao de Obra</footer>
<div id="toast"></div>

<script>
var SHEET_ID='1uYl5jd-0eMqxnCpXZI2Rm7VtOdCmrd6CWKFfGX_sgTU';
var SHEET_GID='286377544';
var PAVIMENTOS=['TÉRREO','1º','2º','3º','ENAE','INF'];
var PAV_CORES={'TÉRREO':'#2563EB','1º':'#0D9F4F','2º':'#D97706','3º':'#7C3AED','ENAE':'#DC2626','INF':'#0891B2'};
var PAV_BADGE={'TÉRREO':'badge-pav-terreo','1º':'badge-pav-1','2º':'badge-pav-2','3º':'badge-pav-3','ENAE':'badge-pav-enae','INF':'badge-pav-inf'};
var PARSED=null;
var SELECTED_DATE_IDX=0;
var COLORS=['#2563EB','#D97706','#0D9F4F','#7C3AED','#DC2626','#0891B2','#DB2777','#65A30D','#EA580C','#0284C7'];

function norm(s){return(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function esc(s){return(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function uniq(arr){return[...new Set(arr.filter(function(v){return v!==''}))].sort(function(a,b){return a.localeCompare(b,'pt-BR')})}
function fmtNow(){return new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}

var KW_VAZIO=['nao encontrado','não encontrado','n/a','na','nenhum','nenhuma','sem atividade','sem lancamento','sem lançamento','sem serviço','indefinido','—','--','-'];
function temAtividade(v){if(!v||!v.trim())return false;var n=norm(v);if(!n)return false;for(var i=0;i<KW_VAZIO.length;i++){if(n===KW_VAZIO[i]||n.indexOf(KW_VAZIO[i])===0)return false}return true}

function setChip(state,txt){var el=document.getElementById('chip'),dot=document.getElementById('livedot'),t=document.getElementById('chip-txt');el.className='chip chip-'+state;dot.style.display=state==='ok'?'inline-block':'none';t.textContent=txt}
var _ttmr=null;
function toast(msg,type){var el=document.getElementById('toast');el.style.display='block';el.style.background=type==='ok'?'#0D9F4F':type==='warn'?'#D97706':'#DC2626';el.textContent=msg;clearTimeout(_ttmr);_ttmr=setTimeout(function(){el.style.display='none'},3500)}

function findCol(hd,kws){for(var i=0;i<hd.length;i++){var n=norm(hd[i]);for(var k=0;k<kws.length;k++){if(n.indexOf(norm(kws[k]))>-1)return i}}return -1}

/* ═══════ NORMALIZACAO SILENCIOSA ═══════ */
function limparParaMatch(s){return norm(s).replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim()}

function normalizarPavimento(cru){
  if(!cru)return '';var raw=String(cru).trim();if(!raw)return '';
  var limpo=limparParaMatch(raw);
  var MAPA={'terreo':'TÉRREO','terre':'TÉRREO','tereo':'TÉRREO','terrero':'TÉRREO','terrro':'TÉRREO','terreoo':'TÉRREO','rreo':'TÉRREO','ter':'TÉRREO',
    '1':'1º','1o':'1º','1 p':'1º','1p':'1º','1 pav':'1º','1 pavimento':'1º','1 andar':'1º','1pav':'1º','1pavimento':'1º','1andar':'1º','p1':'1º','p 1':'1º','pav 1':'1º','pavimento 1':'1º','primeiro':'1º','pav 1o':'1º',
    '2':'2º','2o':'2º','2 p':'2º','2p':'2º','2 pav':'2º','2 pavimento':'2º','2 andar':'2º','2pav':'2º','2pavimento':'2º','2andar':'2º','p2':'2º','p 2':'2º','pav 2':'2º','pavimento 2':'2º','segundo':'2º','pav 2o':'2º',
    '3':'3º','3o':'3º','3 p':'3º','3p':'3º','3 pav':'3º','3 pavimento':'3º','3 andar':'3º','3pav':'3º','3pavimento':'3º','3andar':'3º','p3':'3º','p 3':'3º','pav 3':'3º','pavimento 3':'3º','terceiro':'3º','pav 3o':'3º',
    'enae':'ENAE','enea':'ENAE','ene':'ENAE','ena':'ENAE','eane':'ENAE','ean':'ENAE',
    'inf':'INF','infr':'INF','infra':'INF','infraestrutura':'INF'};
  if(MAPA[limpo]!==undefined)return MAPA[limpo];
  if(/enae|eane|enea|ena[^a-z]/.test(limpo))return 'ENAE';
  if(/(^|\s)inf[a-z]*($|\s)/.test(limpo))return 'INF';
  if(/terr[eo]{1,3}/.test(limpo))return 'TÉRREO';
  if(/\b3/.test(limpo))return '3º';
  if(/\b2/.test(limpo))return '2º';
  if(/\b1/.test(limpo))return '1º';
  return '';
}

function detectarDoTexto(texto){
  if(!texto)return '';var t=norm(texto);
  if(/enae|eane/.test(t))return 'ENAE';
  if(/inf\b|infra/.test(t))return 'INF';
  if(/terr[eo]/.test(t))return 'TÉRREO';
  if(/\b3[ºo°]?\s*(pav|andar)/.test(t)||/terceiro\s*(pav|andar)/.test(t))return '3º';
  if(/\b2[ºo°]?\s*(pav|andar)/.test(t)||/segundo\s*(pav|andar)/.test(t))return '2º';
  if(/\b1[ºo°]?\s*(pav|andar)/.test(t)||/primeiro\s*(pav|andar)/.test(t))return '1º';
  if(/pavimento\s*1|1\s*pavimento/.test(t))return '1º';
  if(/pavimento\s*2|2\s*pavimento/.test(t))return '2º';
  if(/pavimento\s*3|3\s*pavimento/.test(t))return '3º';
  return '';
}

var KW_FERIAS=['ferias','férias','de ferias','em ferias','feria'];
function isFerias(row,ci){var fields=[ci.status,ci.atividade];for(var fi=0;fi<fields.length;fi++){if(fields[fi]>-1){var v=norm(row[fields[fi]]||'');for(var k=0;k<KW_FERIAS.length;k++){if(v.indexOf(KW_FERIAS[k])>-1)return true}}}return false}

/* ═══════ PARSE ═══════ */
function parseData(raw){
  if(!raw||raw.length<2)return null;
  var hd=raw[0];
  var ci={nome:findCol(hd,['funcionario','lider','nome']),empresa:findCol(hd,['empresa']),funcao:findCol(hd,['funcao','função']),atividade:findCol(hd,['servico','serviço','atividade']),regiao:findCol(hd,['local','regiao','região','area','área']),pav:findCol(hd,['pav']),data:findCol(hd,['data inicio','data']),status:findCol(hd,['status']),prod:findCol(hd,['prod']),id:findCol(hd,['id'])};
  var people=[];
  for(var r=1;r<raw.length;r++){
    var row=raw[r];var nome=(ci.nome>-1?row[ci.nome]||'':'').trim();
    if(!nome||nome.length<2)continue;if(norm(nome).indexOf('total')>-1)continue;
    var vac=isFerias(row,ci);
    var atividadeRaw=(ci.atividade>-1?row[ci.atividade]||'':'').trim();
    var pavRaw=(ci.pav>-1?row[ci.pav]||'':'').trim();
    var pavNorm=normalizarPavimento(pavRaw);
    if(!pavNorm&&atividadeRaw)pavNorm=detectarDoTexto(atividadeRaw);
    people.push({nome:nome,empresa:(ci.empresa>-1?row[ci.empresa]||'':'').trim()||'—',funcao:(ci.funcao>-1?row[ci.funcao]||'':'').trim()||'—',atividade:temAtividade(atividadeRaw)?atividadeRaw:'',atividadeRaw:atividadeRaw,regiao:(ci.regiao>-1?row[ci.regiao]||'':'').trim(),pav:pavNorm,pavRaw:pavRaw,prod:(ci.prod>-1?row[ci.prod]||'':'').trim(),data:(ci.data>-1?row[ci.data]||'':'').trim(),status:(ci.status>-1?row[ci.status]||'':'').trim(),ferias:vac});
  }
  var byDate={};
  people.forEach(function(p){var d=p.data||'(sem data)';if(!byDate[d])byDate[d]={date:d,all:[],ativos:[],ferias:[],byEmp:{},byFunc:{},byPav:{},byRegiao:{}};byDate[d].all.push(p);if(p.ferias){byDate[d].ferias.push(p);return}byDate[d].ativos.push(p);byDate[d].byEmp[p.empresa]=(byDate[d].byEmp[p.empresa]||0)+1;byDate[d].byFunc[p.funcao]=(byDate[d].byFunc[p.funcao]||0)+1;if(p.pav)byDate[d].byPav[p.pav]=(byDate[d].byPav[p.pav]||0)+1;if(p.regiao)byDate[d].byRegiao[p.regiao]=(byDate[d].byRegiao[p.regiao]||0)+1});
  var days=Object.keys(byDate).sort().reverse().map(function(d){return byDate[d]});
  return{ci:ci,hd:hd,people:people,days:days};
}

function renderChart(days,selectedDay){
  var el=document.getElementById('chart-box'),meta=document.getElementById('chart-meta');
  if(!days||!days.length){el.innerHTML='<div class="em">Sem dados</div>';return}
  meta.textContent=days.length+' dia(s)';
  var W=640,H=220,pL=44,pR=16,pT=16,pB=48;
  var vals=days.map(function(d){return d.ativos.length}).reverse();
  var labels=days.map(function(d){return d.date}).reverse();
  var selIdx=-1;if(selectedDay){for(var si=0;si<labels.length;si++){if(labels[si]===selectedDay.date){selIdx=si;break}}}
  var n=vals.length,maxV=Math.max.apply(null,vals.concat([1]));
  function xS(i){return pL+(n>1?i/(n-1):0.5)*(W-pL-pR)}function yS(v){return pT+(1-v/maxV)*(H-pT-pB)}

  for(var g=0;g<=4;g++){var gy=yS(maxV*g/4);svg+='<line x1="'+pL+'" y1="'+gy+'" x2="'+(W-pR)+'" y2="'+gy+'" stroke="#E2E8F0" stroke-dasharray="3,3"/><text x="'+(pL-6)+'" y="'+(gy+4)+'" text-anchor="end" fill="#94A3B8" font-family="JetBrains Mono" font-size="9">'+Math.round(maxV*g/4)+'</text>'}

  var area='M '+xS(0)+' '+(H-pB)+' L '+xS(0)+' '+yS(vals[0]);for(var pi=1;pi<n;pi++)area+=' L '+xS(pi)+' '+yS(vals[pi]);area+=' L '+xS(n-1)+' '+(H-pB)+' Z';
  svg+='<path d="'+area+'" fill="#059669" opacity="0.10"/>';
  var line='M '+xS(0)+' '+yS(vals[0]);for(var li=1;li<n;li++)line+=' L '+xS(li)+' '+yS(vals[li]);
  svg+='<path d="'+line+'" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  for(var ci=0;ci<n;ci++){var cx=xS(ci),cy=yS(vals[ci]),isSel=ci===selIdx;svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(isSel?6:4)+'" fill="'+(isSel?'#D97706':'#059669')+'" stroke="#fff" stroke-width="'+(isSel?3:2)+'"/>';if(n<=12||isSel)svg+='<text x="'+cx+'" y="'+(cy-11)+'" text-anchor="middle" fill="'+(isSel?'#D97706':'#059669')+'" font-family="JetBrains Mono" font-size="'+(isSel?12:10)+'" font-weight="700">'+vals[ci]+'</text>'}
  if(selIdx>=0)svg+='<circle cx="'+xS(selIdx)+'" cy="'+yS(vals[selIdx])+'" r="10" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.5"><animate attributeName="r" from="6" to="14" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.6" to="0" dur="1.5s" repeatCount="indefinite"/></circle>';
  svg+='</svg>';el.innerHTML=svg;
}

function getFilteredPeople(day){

  var q=norm(document.getElementById('fq').value),emp=document.getElementById('femp').value,func=document.getElementById('ffunc').value,pav=document.getElementById('fpav').value,st=document.getElementById('fstatus').value;
  var active=[],ferias=[];
  day.all.forEach(function(p){
    if(p.ferias){if(!st||st==='ferias')ferias.push(p);return}
    if(st==='ferias')return;
    if(emp&&p.empresa!==emp)return;
    if(func&&p.funcao!==func)return;
    if(pav&&p.pav!==pav)return;
    if(st==='ativo'&&!p.atividade)return;

}

  var s=document.createElement('script');s.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=responseHandler:'+cbName+'&gid='+SHEET_GID+'&_='+Date.now();
  s.onerror=function(){if(ok)return;ok=true;delete window[cbName];setChip('err','erro');document.getElementById('err-box').innerHTML='<div class="err-box"><b>Erro de rede.</b><br><a href="https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/edit" target="_blank">Abrir planilha</a></div>';btn.classList.remove('spin');toast('Erro de rede','err')};
  setTimeout(function(){if(!ok){ok=true;delete window[cbName];setChip('err','timeout');btn.classList.remove('spin');toast('Timeout','err')}},15000);
  document.head.appendChild(s);
}

function doPrint(){var now=new Date(),day=getSelectedDay(),ph=document.getElementById('print-header');ph.innerHTML='<h1>RDO - Relatorio Diario de Obra</h1><p>'+now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+(day?' | Data: '+day.date+' | Efetivo: '+day.ativos.length+' ativos':'')+'</p>';setTimeout(function(){window.print()},120)}

function doExportCSV(){var day=getSelectedDay();if(!day){toast('Sem dados','warn');return}var rows=[['Nome','Funcao','Empresa','Atividade','Pavimento','Local','Producao','Status','Data']];day.all.forEach(function(p){rows.push([p.nome,p.funcao,p.empresa,p.atividade,p.pav||'',p.regiao||'',p.prod||'',p.ferias?'Ferias':p.atividade?'Ativo':'Sem atividade',p.data])});var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v||'').replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='RDO_'+day.date+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);toast('CSV exportado','ok')}

setInterval(function(){document.getElementById('clk').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})},1000);
doLoad();
</script>
