<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Painel de Obra</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1D33;--navy2:#122B4D;--paper:#F4F6F8;--w:#fff;--grid:#E2E8F0;--ink:#1A2332;--ink2:#475569;--ink3:#94A3B8;--green:#0D9F4F;--greenBg:#E6F9EE;--amber:#D97706;--amberBg:#FEF3C7;--red:#DC2626;--redBg:#FEE2E2;--blue:#2563EB;--blueBg:#DBEAFE;--cyan:#0891B2;--cyanBg:#CFFAFE;--purple:#7C3AED;--purpleBg:#EDE9FE;--line:#CBD5E1;--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(var(--safe-b) + 12px)}
::selection{background:var(--amber);color:#fff}
input,select,button{-webkit-appearance:none;appearance:none}

/* SPINNER */
.spinner-wrap{display:flex;align-items:center;justify-content:center;padding:40px 20px;gap:10px;color:var(--ink3)}
.spinner{width:20px;height:20px;border:2.5px solid var(--grid);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.topbar{background:var(--navy);color:#fff;padding:0 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.topbar-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:50px;gap:8px}
.logo{width:28px;height:28px;min-width:28px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:11px;color:var(--navy);border-radius:2px}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-family:'Space Grotesk';font-size:15px;font-weight:700;white-space:nowrap}
.brand small{font-size:9px;color:#8BADC4;display:block;line-height:1.2}
.actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:'JetBrains Mono';font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.chip-ok{background:rgba(13,159,79,.2);color:#6EE7A0}
.chip-warn{background:rgba(217,119,6,.2);color:#FCD34D}
.chip-err{background:rgba(220,38,38,.2);color:#FCA5A5}
.btn{font-family:'JetBrains Mono';font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:4px;padding:7px 10px;border-radius:2px;transition:all .15s;min-height:36px;touch-action:manipulation}
.btn-a{background:var(--amber);color:var(--navy)}.btn-a:hover{background:#F59E0B}
.btn-gr{background:var(--green);color:#fff}.btn-gr:hover{background:#077A3D}
.btn-bl{background:var(--blue);color:#fff}.btn-bl:hover{background:#1D4ED8}
.btn-rd{background:var(--red);color:#fff}.btn-rd:hover{background:#B91C1C}
.btn-ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}.btn-ghost:hover{background:var(--paper);color:var(--ink)}
.btn-sm{font-size:9px;padding:4px 7px;min-height:28px}
.btn-a.spin svg{animation:spin .8s linear infinite}
.sched-chip{font-family:'JetBrains Mono';font-size:9px;padding:2px 7px;border-radius:2px;background:rgba(13,159,79,.15);color:#6EE7A0;border:1px solid rgba(13,159,79,.2);white-space:nowrap}
.tabs{background:var(--navy2);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs-in{max-width:1320px;margin:0 auto;display:flex;min-width:max-content}
.tab{font-family:'JetBrains Mono';font-size:10px;color:#6B8FAD;background:0 0;border:none;padding:11px 12px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-weight:500;transition:all .15s;touch-action:manipulation;min-height:40px}
.tab:hover{color:#B8D4E8}.tab.on{color:#fff;border-bottom-color:var(--amber);font-weight:700}
.container{max-width:1320px;margin:0 auto;padding:16px 12px}
.sh{display:none}.sh.on{display:block;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.sec-h h2{font-family:'Space Grotesk';font-size:18px;font-weight:700;color:var(--navy)}
.sec-h p{color:var(--ink2);font-size:11px;margin-top:2px}
.sec-h .sec-actions{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-family:'JetBrains Mono';font-size:8px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;background:var(--navy);color:#fff;padding:2px 6px;margin-right:6px}
.tag-civ{background:#6B4226}.tag-ele{background:var(--blue)}.tag-imp{background:var(--amber)}
.kr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kp{background:var(--w);border:1px solid var(--line);padding:14px;position:relative;overflow:hidden;border-radius:2px}
.kp::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:var(--kc,var(--navy))}
.kp .ki{font-size:14px;margin-bottom:6px}.kp .kl{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.kp .kv{font-family:'Space Grotesk';font-size:22px;font-weight:700;color:var(--navy);line-height:1.1}.kp .kv small{font-size:12px;color:var(--ink2);font-weight:600}
.kp .kf{font-size:10px;color:var(--ink2);margin-top:4px}.kp .kd{font-family:'JetBrains Mono';font-size:10px;font-weight:700;margin-top:2px}
.kd.up{color:var(--green)}.kd.dn{color:var(--red)}.kd.eq{color:var(--ink3)}
.bar-w{margin-top:8px;display:flex;align-items:center;gap:6px}.bar-t{flex:1;height:5px;background:var(--grid);position:relative;border-radius:3px}
.bar-f{position:absolute;top:0;left:0;height:100%;border-radius:3px;transition:width .6s}.bar-v{font-family:'JetBrains Mono';font-size:10px;font-weight:700;min-width:38px;text-align:right}
.cd{background:var(--w);border:1px solid var(--line);border-radius:2px;margin-bottom:14px}
.cd-h{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.cd-h h3{font-family:'Space Grotesk';font-size:13px;font-weight:600;color:var(--navy)}.cd-h .mt{font-family:'JetBrains Mono';font-size:9px;color:var(--ink3)}
.cd-b{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cd-t{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--w);flex-wrap:wrap;align-items:center}
.cd-t input,.cd-t select{font-family:'Inter';font-size:13px;padding:8px 10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:2px;min-height:38px;flex:1;min-width:0}
.cd-t input:focus,.cd-t select:focus{outline:2px solid var(--amber);outline-offset:-1px}
.cd-t .ct{font-family:'JetBrains Mono';font-size:9px;color:var(--ink3);white-space:nowrap;width:100%;text-align:right;margin-top:2px}
table.t{width:100%;border-collapse:collapse;font-size:12px;min-width:500px}
table.t th{position:sticky;top:0;background:var(--navy);color:#fff;font-family:'JetBrains Mono';font-weight:500;font-size:9px;letter-spacing:.03em;text-transform:uppercase;text-align:left;padding:8px 10px;white-space:nowrap;z-index:2;cursor:pointer;user-select:none;transition:background .15s}
table.t th:hover{background:#1a3a5c}
table.t th .sort-arrow{opacity:.4;margin-left:3px;font-size:8px}
table.t th.sorted-asc .sort-arrow,table.t th.sorted-desc .sort-arrow{opacity:1}
table.t th.sorted-asc .sort-arrow::after{content:'\25B2'}table.t th.sorted-desc .sort-arrow::after{content:'\25BC'}
table.t td{padding:7px 10px;border-bottom:1px solid #EEF2F6;vertical-align:middle;font-size:12px}
table.t tr:hover{background:#F8FAFC}
table.t tr.sub{background:#F1F5F9;font-weight:700}.table.t tr.sub td{border-top:1px solid var(--line)}
td.nr{text-align:right;font-family:'JetBrains Mono'}td.pc{min-width:140px}
.st{font-family:'JetBrains Mono';font-size:9px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap}
.st-g{background:var(--greenBg);color:#077A3D}.st-r{background:var(--redBg);color:#B91C1C}
.al{list-style:none}.al li{padding:10px 14px;border-bottom:1px solid #EEF2F6;display:flex;gap:8px;align-items:flex-start;font-size:12px}.al li:last-child{border-bottom:none}
.al-i{width:26px;height:26px;min-width:26px;border-radius:2px;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.al-i.hi{background:var(--redBg);color:var(--red)}.al-i.md{background:var(--amberBg);color:var(--amber)}.al-i.lo{background:var(--blueBg);color:var(--blue)}
.al-b{flex:1;min-width:0}.al-t{font-weight:600;color:var(--navy);font-size:12px;word-break:break-word}
.al-src{font-family:'JetBrains Mono';font-size:8px;padding:2px 5px;border-radius:2px;font-weight:600;margin-left:4px;display:inline-block}
.al-src.civil{background:#FEF3C7;color:#92400E}.al-src.eletrica{background:var(--blueBg);color:var(--blue)}.al-src.clima{background:var(--cyanBg);color:var(--cyan)}.al-src.manta{background:#FCE7F3;color:#BE185D}.al-src.revest{background:var(--purpleBg);color:var(--purple)}
.al-d{color:var(--ink2);font-size:11px;word-break:break-word}
.al-c{font-family:'JetBrains Mono';font-size:9px;color:var(--amber);font-weight:600;margin-top:3px;padding:3px 8px;background:var(--amberBg);display:inline-block;border-radius:2px;border:1px solid #FDE68A;word-break:break-word}
.al-col{font-family:'JetBrains Mono';font-size:8px;color:var(--ink3);margin-top:2px}
.cb{padding:12px 14px}.cb-r{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cb-l{font-family:'JetBrains Mono';font-size:10px;color:var(--ink2);min-width:70px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-t{flex:1;height:18px;background:var(--paper);position:relative;overflow:hidden;border-radius:2px}
.cb-f{position:absolute;top:0;left:0;height:100%;border-radius:2px;transition:width .7s cubic-bezier(.22,1,.36,1)}
.cb-v{font-family:'JetBrains Mono';font-size:10px;font-weight:700;min-width:38px}
.tw{padding:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}.tw svg{display:block;min-width:400px;height:auto}
.tw-empty{padding:28px 14px;text-align:center;color:var(--ink3)}
.cr{display:flex;align-items:center;gap:6px;padding:7px 14px;border-bottom:1px solid #EEF2F6;font-size:12px;flex-wrap:wrap}.cr:last-child{border-bottom:none}
.cr-m{font-family:'JetBrains Mono';font-weight:600;color:var(--navy);min-width:80px;font-size:11px}
.cr-f,.cr-t2{font-family:'JetBrains Mono';font-size:10px;min-width:45px;text-align:right}.cr-ar{color:var(--ink3)}
.cr-d{font-family:'JetBrains Mono';font-size:10px;font-weight:700;min-width:60px}
.cr-d.pos{color:var(--green)}.cr-d.neg{color:var(--red)}.cr-d.zero{color:var(--ink3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gg{display:grid;grid-template-columns:1.618fr 1fr;gap:14px}
.em{padding:28px 14px;text-align:center;color:var(--ink3);font-size:12px}
.backup-bar{background:var(--w);border:1px solid var(--line);border-radius:2px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.backup-bar .bb-l{font-family:'JetBrains Mono';font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-right:auto;width:100%;margin-bottom:4px}
.backup-bar .btn{flex:1;min-width:auto;justify-content:center}
.sched-grid{padding:12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.sched-grid table{border-collapse:collapse;font-family:'JetBrains Mono';font-size:9px;width:100%;min-width:340px;max-width:600px}
.sched-grid th{padding:3px 5px;color:var(--ink3);font-weight:500;text-align:center}
.sched-grid td{text-align:center;padding:2px 3px}
.sched-cell{width:20px;height:20px;border-radius:2px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff}
.causa-chip{font-family:'JetBrains Mono';font-size:9px;padding:4px 8px;border-radius:2px;display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--w)}
.causa-chip .cc-count{background:var(--navy);color:#fff;padding:1px 5px;border-radius:2px;font-weight:700}
.causa-chip .cc-pct{color:var(--ink3);font-weight:400}
#toast{position:fixed;bottom:calc(var(--safe-b) + 12px);left:12px;right:12px;z-index:200;display:none;padding:12px 16px;border-radius:4px;font-family:'JetBrains Mono';font-size:11px;font-weight:600;color:#fff;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.2)}
footer{max-width:1320px;margin:0 auto;padding:14px 12px calc(var(--safe-b) + 36px);font-size:9px;color:var(--ink3);font-family:'JetBrains Mono';border-top:1px solid var(--line)}
@media print{body{background:#fff}.topbar,.tabs,.cd-t,.btn,.actions,.backup-bar,.sec-actions{display:none!important}.container{padding:8px}.sh{display:block!important}}
::-webkit-scrollbar{height:4px;width:4px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
@media(max-width:900px){.g2,.gg{grid-template-columns:1fr}.kr{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}
@media(max-width:700px){.container{padding:12px 10px}.sec-h h2{font-size:16px}.kp .kv{font-size:20px}.kp{padding:12px}.cd-h{padding:8px 10px}.cd-h h3{font-size:12px}.cd-t{padding:6px 8px;gap:4px}.cd-t input,.cd-t select{font-size:13px;padding:7px 8px;min-height:36px}.al li{padding:8px 10px;gap:6px}table.t{font-size:11px;min-width:420px}table.t th{padding:7px 8px;font-size:8px}table.t td{padding:6px 8px;font-size:11px}.cb-l{min-width:55px;font-size:9px}.cb-v{font-size:9px}.backup-bar{padding:8px 10px}.sched-grid{padding:8px 10px}.sched-grid table{min-width:300px}.sched-cell{width:18px;height:18px;font-size:6px}}
@media(max-width:480px){
.topbar{padding:0 10px}.topbar-in{height:auto;min-height:46px;flex-wrap:wrap;padding:6px 0;gap:4px}.brand h1{font-size:13px}.brand small{font-size:8px}.logo{width:24px;height:24px;font-size:10px}
.actions{gap:4px;width:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}.sched-chip{display:none}#today-ct{display:none}
.tab{padding:10px 10px;font-size:9px;min-height:38px}.container{padding:10px 8px}
.kr{grid-template-columns:1fr 1fr;gap:6px}.kp{padding:10px}.kp .ki{font-size:12px;margin-bottom:4px}.kp .kl{font-size:8px}.kp .kv{font-size:18px}.kp .kf{font-size:9px}.kp .kd{font-size:9px}
.sec-h h2{font-size:14px}.sec-h p{font-size:10px}.tag{font-size:7px;padding:1px 5px;margin-right:4px}
.cd{margin-bottom:10px}.cd-t{padding:6px 8px;gap:4px;flex-direction:column}.cd-t input,.cd-t select{width:100%;font-size:14px;padding:10px 10px;min-height:42px}.cd-t .ct{width:100%;text-align:left;font-size:9px}
.al li{padding:8px 10px;font-size:11px}.al-t{font-size:11px}.al-d{font-size:10px}
table.t{min-width:360px;font-size:10px}table.t th{padding:6px 7px;font-size:8px}table.t td{padding:5px 7px;font-size:10px}
.causa-chip{font-size:8px;padding:3px 6px}.g2{gap:10px}.gg{gap:10px}
.backup-bar{flex-direction:column;align-items:stretch;gap:6px}.backup-bar .btn{width:100%;justify-content:center;font-size:9px;padding:8px}
.cr{padding:6px 10px;font-size:11px;gap:4px}.cr-m{font-size:10px;min-width:60px}.cr-d{font-size:9px;min-width:50px}
footer{font-size:8px;padding:10px 8px calc(var(--safe-b) + 28px)}
.sec-actions .btn{font-size:8px;padding:4px 6px;min-height:24px}
}
@media(max-width:360px){.kr{grid-template-columns:1fr}.kp .kv{font-size:16px}.brand h1{font-size:12px}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><div class="logo">OB</div><div><h1>Painel de Obra</h1><small>Auto 7h-17h seg-sex</small></div></div>
    <div class="actions">
      <span class="sched-chip" id="sched-st">agendado</span>
      <span class="chip chip-warn" id="chip">carregando</span>
      <span style="font-family:'JetBrains Mono';font-size:9px;color:#8BADC4" id="clk">--:--</span>
      <span style="font-family:'JetBrains Mono';font-size:9px;color:#6EE7A0" id="today-ct"></span>
      <button class="btn btn-a" id="bref" onclick="doReload()"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 11-2.6-6.4M21 3v6h-6"/></svg>Atualizar</button>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tabs-in" id="tabs">
    <button class="tab on" data-s="exec">Resumo</button>
    <button class="tab" data-s="civil">Civil</button>
    <button class="tab" data-s="eletrica">MEP</button>
    <button class="tab" data-s="causas">Causas</button>
    <button class="tab" data-s="hist">Historico</button>
    <button class="tab" data-s="manta">Impermeab.</button>
    <button class="tab" data-s="revest">Revest.</button>
    <button class="tab" data-s="clima">Clima</button>
    <button class="tab" data-s="diag">Diag.</button>
  </div>
</div>

<!-- RESUMO -->
<section class="sh on" id="s-exec">
  <div class="container">
    <div class="sec-h"><div><h2><span class="tag">exec</span>Resumo Executivo</h2></div><div style="font-family:'JetBrains Mono';font-size:9px;color:var(--ink3)" id="exets">--</div></div>
    <div class="kr" id="e-kpi"><div class="spinner-wrap"><div class="spinner"></div><span style="font-size:12px">Carregando dados...</span></div></div>
    <div id="daily-box"></div><div id="stale-box"></div><div id="causa-box"></div>
    <div class="gg">
      <div class="cd"><div class="cd-h"><h3>Progresso por disciplina</h3></div><div class="cd-b" id="e-disc"><div class="spinner-wrap"><div class="spinner"></div></div></div></div>
      <div class="cd"><div class="cd-h"><h3>Alertas</h3><span class="mt" id="e-act"></span></div><div class="cd-b"><ul class="al" id="e-alerts"><li><div class="spinner-wrap"><div class="spinner"></div></div></li></ul></div></div>
    </div>
  </div>
</section>

<!-- CIVIL -->
<section class="sh" id="s-civil">
  <div class="container">
    <div class="sec-h"><div><h2><span class="tag tag-civ">civil</span>Avanco Fisico</h2><p>Planilha: Avanco Fisico</p></div><div class="sec-actions"><button class="btn btn-sm btn-ghost" onclick="exportCSV('av-tbl','avanco_fisico')">CSV</button></div></div>
    <div class="kr" id="av-kpi"></div>
    <div class="cd">
      <div class="cd-t">
        <input type="text" id="favq" placeholder="Buscar..." oninput="rAv()">
        <select id="favp" onchange="rAv()"><option value="">Todos Pav.</option></select>
        <select id="favr" onchange="rAv()" style="display:none"><option value="">Todos Resp.</option></select>
        <select id="favs" onchange="rAv()"><option value="">Status</option><option value="ok">&ge;85%</option><option value="warn">50-85%</option><option value="crit">&lt;50%</option></select>
        <span class="ct" id="cav"></span>
      </div>
      <div class="cd-b" id="av-tbl"></div>
    </div>
  </div>
</section>

<!-- ELETRICA -->
<section class="sh" id="s-eletrica">
  <div class="container">
    <div class="sec-h"><div><h2><span class="tag tag-ele">mep</span>Eletrica / MEP</h2><p>Planilha: Acompanhamento</p></div><div class="sec-actions"><button class="btn btn-sm btn-ghost" onclick="exportCSV('mrt','mep_detalhes')">CSV</button></div></div>
    <div class="g2">
      <div class="cd"><div class="cd-h"><h3>Por tipo</h3><span class="mt" id="mdm"></span></div><div class="cd-b" id="mdt"></div></div>
      <div class="cd"><div class="cd-h"><h3>Por pavimento</h3><span class="mt" id="mfm"></span></div><div class="cd-b" id="mft"></div></div>
